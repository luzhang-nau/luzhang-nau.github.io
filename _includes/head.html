<!-- 最终适配：导航栏独立一行 + 6项均分宽度 -->
<style>
/* 导航栏容器：独立一行，不与头像重叠 */
.masthead {
  display: block !important;
  width: 100% !important;
}

/* 主导航标题：单独一行 */
.masthead .greedy-nav .visible-links li:first-child {
  display: block !important;
  width: 100% !important;
  margin: 0 0 10px 0 !important;
  padding: 0 !important;
}

/* 6个子导航项：在新行均分宽度 */
.masthead .greedy-nav .visible-links {
  display: flex !important;
  flex-wrap: nowrap !important;
  justify-content: space-around !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  border-top: 1px solid #eee !important; /* 分隔线，区分标题和导航 */
  padding-top: 10px !important;
}

/* 子导航项：均分宽度，不重叠 */
.masthead .greedy-nav .visible-links li:not(:first-child):not(:has(#theme-toggle)) {
  flex: 1 1 0% !important;
  min-width: 80px !important;
  text-align: center !important;
  margin: 0 5px !important;
  padding: 0 !important;
}

/* 子导航链接：正常显示 */
.masthead .greedy-nav .visible-links li:not(:first-child):not(:has(#theme-toggle)) a {
  display: block !important;
  width: 100% !important;
  padding: 0.5rem 0 !important;
  color: #333 !important; /* 恢复文字颜色 */
}

/* 隐藏多余元素，避免干扰 */
.masthead .greedy-nav button,
.masthead .greedy-nav .hidden-links {
  display: none !important;
}
</style>
