<!-- 最终版：6个导航项同一行均分宽度 -->
<style>
/* 导航容器：设置足够的最小宽度，强制一行显示 */
.masthead .greedy-nav {
  display: flex !important;
  align-items: center !important;
  position: relative !important;
  min-width: 700px !important; /* 足够宽，容纳6个项 */
  width: 100% !important;
}

/* 可见导航容器：强制一行，不换行 */
.masthead .greedy-nav .visible-links {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  flex-wrap: nowrap !important; /* 禁止换行 */
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
}

/* 主导航：固定宽度 */
.masthead .greedy-nav .visible-links li:first-child {
  flex: 0 0 auto !important;
  width: auto !important;
  margin-right: 20px !important;
}

/* 6个子导航项：同一行均分宽度 */
.masthead .greedy-nav .visible-links li:not(:first-child):not(:has(#theme-toggle)) {
  flex: 1 1 0% !important; /* 严格均分 */
  min-width: 80px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  margin: 0 5px !important;
  padding: 0 !important;
  white-space: nowrap !important;
  font-size: 0.95rem !important;
}

/* 子导航链接：文字居中 */
.masthead .greedy-nav .visible-links li:not(:first-child):not(:has(#theme-toggle)) a {
  width: 100% !important;
  text-align: center !important;
  padding: 0.5rem 0 !important;
}

/* 隐藏折叠按钮（强制一行显示） */
.masthead .greedy-nav button {
  display: none !important;
}
</style>
