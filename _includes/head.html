<!-- 最终方案：导航宽度匹配内容宽度 + 6项均分 -->
<style>
/* 1. 匹配内容宽度（关键：和指导学生页面内容宽度一致，这里设为1080px，和你科研项目页面一致） */
.masthead .greedy-nav {
  width: 1080px !important; /* 核心：和内容区宽度一致 */
  max-width: 95% !important; /* 小屏幕适配，不超屏幕 */
  margin: 0 auto !important; /* 导航栏居中，和内容区对齐 */
  display: block !important;
  padding: 0 10px !important; /* 和内容区padding一致 */
}

/* 2. 主导航标题：单独一行，不占均分宽度 */
.masthead .greedy-nav .visible-links li:first-child {
  display: block !important;
  width: 100% !important;
  margin: 0 0 10px 0 !important;
  padding: 0 !important;
  text-align: left !important; /* 对齐内容区文字 */
}

/* 3. 6个子导航容器：匹配内容宽度，强制一行 */
.masthead .greedy-nav .visible-links {
  display: flex !important;
  flex-wrap: nowrap !important;
  justify-content: space-between !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
  border-top: 1px solid #eee !important;
  padding-top: 10px !important;
}

/* 4. 核心：6个子导航项均分内容宽度（1080px） */
.masthead .greedy-nav .visible-links li:not(:first-child):not(:has(#theme-toggle)) {
  flex: 1 1 calc(100% / 6) !important; /* 严格6等分内容宽度 */
  min-width: 0 !important;
  text-align: center !important;
  margin: 0 !important;
  padding: 0 !important;
}

.masthead .greedy-nav .visible-links li:not(:first-child):not(:has(#theme-toggle)) a {
  display: block !important;
  width: 100% !important;
  padding: 0.5rem 0 !important;
  color: inherit !important;
  text-decoration: none !important;
}

.masthead .greedy-nav button,
.masthead .greedy-nav .hidden-links {
  display: none !important;
}
</style>
