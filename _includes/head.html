{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<!-- 新增：略微放宽每个导航项 -->
<style>
/* 给每个子导航项增加左右内边距（放宽点击区域） */
.masthead__menu-item a {
  padding-left: 15px !important;  /* 左边加15px宽度 */
  padding-right: 15px !important; /* 右边加15px宽度 */
  white-space: nowrap;            /* 防止文字换行 */
}

/* 可选：增加导航项之间的间距（更宽松） */
.masthead__menu-item {
  margin-right: 5px !important; /* 每个项右边加5px间距 */
}
</style>
